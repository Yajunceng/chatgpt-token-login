<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Token 登录工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #856404;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
            display: block;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #014361;
        }

        .info-box ul {
            margin: 10px 0 0 20px;
        }

        .info-box li {
            margin: 5px 0;
        }

        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 ChatGPT Token 登录工具</h1>
        <p class="subtitle">使用 Session Token 快速登录到 ChatGPT 账号</p>

        <div class="warning">
            ⚠️ <strong>安全提示：</strong>这个工具完全在本地运行，不会上传任何数据到服务器。使用完后记得让朋友重新登录以使旧 token 失效。
        </div>

        <div>
            <label for="tokenInput">粘贴 Session Token：</label>
            <textarea
                id="tokenInput"
                placeholder="粘贴以 eyJhbGci 开头的完整 sessionToken..."
                spellcheck="false"
            ></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="loginBtn">
                🚀 使用 Token 登录
            </button>
            <button class="btn-secondary" id="clearBtn">
                🗑️ 清除
            </button>
        </div>

        <div id="status" class="status"></div>

        <div class="info-box">
            <strong>📝 使用说明：</strong>
            <ul>
                <li>1. 让你朋友发送他的 <code>sessionToken</code> 给你</li>
                <li>2. 粘贴到上面的输入框</li>
                <li>3. 点击"使用 Token 登录"</li>
                <li>4. 会打开新窗口，自动登录到他的账号</li>
                <li>5. 在新窗口中访问充值页面，输入你的U卡信息</li>
                <li>6. 充值完成后关闭窗口</li>
            </ul>
        </div>
    </div>

    <script>
        function showStatus(message, isError) {
            var status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + (isError ? 'error' : 'success');

            if (!isError) {
                setTimeout(function() {
                    status.style.display = 'none';
                }, 5000);
            }
        }

        function clearToken() {
            document.getElementById('tokenInput').value = '';
            document.getElementById('status').style.display = 'none';
        }

        function loginWithToken() {
            var token = document.getElementById('tokenInput').value.trim();

            if (!token) {
                showStatus('❌ 请先粘贴 Session Token', true);
                return;
            }

            if (!token.startsWith('eyJ')) {
                showStatus('❌ Token 格式不正确，应该以 eyJ 开头', true);
                return;
            }

            showStatus('✅ 正在打开新窗口...', false);

            // 打开新窗口
            var newWindow = window.open('about:blank', '_blank', 'width=1200,height=800');

            if (!newWindow) {
                showStatus('❌ 无法打开新窗口，请允许弹出窗口', true);
                return;
            }

            // 构建登录页面 HTML
            var loginPageHTML = '<!DOCTYPE html>' +
                '<html><head><title>正在登录 ChatGPT...</title>' +
                '<style>' +
                'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }' +
                '.loader { text-align: center; color: white; }' +
                '.spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }' +
                '@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }' +
                'h2 { margin: 0 0 10px 0; } p { margin: 5px 0; opacity: 0.9; }' +
                '</style></head><body>' +
                '<div class="loader"><div class="spinner"></div><h2>正在登录 ChatGPT</h2><p>请稍候，正在注入认证信息...</p></div>' +
                '<script>' +
                'setTimeout(function() {' +
                '  window.location.href = "https://chatgpt.com";' +
                '}, 1000);' +
                'window.addEventListener("load", function() {' +
                '  setTimeout(function() {' +
                '    var cookies = document.cookie.split(";");' +
                '    for (var i = 0; i < cookies.length; i++) {' +
                '      var cookie = cookies[i];' +
                '      var name = cookie.trim().split("=")[0];' +
                '      document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;domain=.chatgpt.com";' +
                '    }' +
                '    var token = ' + JSON.stringify(token) + ';' +
                '    var expires = new Date();' +
                '    expires.setDate(expires.getDate() + 30);' +
                '    document.cookie = "__Secure-next-auth.session-token=" + token + "; expires=" + expires.toUTCString() + "; domain=.chatgpt.com; path=/; secure; samesite=lax";' +
                '    setTimeout(function() {' +
                '      window.location.href = "https://chatgpt.com/settings/billing";' +
                '    }, 1000);' +
                '  }, 2000);' +
                '});' +
                '<\/script></body></html>';

            newWindow.document.write(loginPageHTML);
            newWindow.document.close();

            showStatus('✅ 新窗口已打开！等待几秒后会自动跳转到充值页面', false);
        }

        // 绑定事件
        document.getElementById('loginBtn').addEventListener('click', loginWithToken);
        document.getElementById('clearBtn').addEventListener('click', clearToken);

        // 支持快捷键
        document.getElementById('tokenInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                loginWithToken();
            }
        });
    </script>
</body>
</html>
